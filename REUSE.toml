# See https://reuse.software/spec-3.3/#reusetoml for specification
version = 1


[[annotations]]
path = [
    "Makefile",
    "*.mk",
    "Dockerfile.ncurl",
    "**/Build.act",
    "src/**",
    "gen_adata/**",
    "test/**",
    "minisys/**",
    "fleetmgr/**",
    "scripts/**",
    "**/snapshots/expected/**"
]
SPDX-FileCopyrightText = "Deutsche Telekom AG"
SPDX-License-Identifier = "BSD-3-Clause"


[[annotations]]
path = [
    ".gitignore",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "REUSE.toml",
    "zensical.toml",
    "docs/**",
    ".github/**"
]
SPDX-FileCopyrightText = "Deutsche Telekom AG"
SPDX-License-Identifier = "CC0-1.0"


# Third-party parts of the committed web UI build. These tables come after
# fleetmgr/**, so they win for these files.
[[annotations]]
path = "fleetmgr/webui/build/**/inter-*.woff2"
SPDX-FileCopyrightText = "2016 The Inter Project Authors <https://github.com/rsms/inter>"
SPDX-License-Identifier = "OFL-1.1"


[[annotations]]
path = "fleetmgr/webui/build/**/jetbrains-mono-*.woff2"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors <https://github.com/JetBrains/JetBrainsMono>"
SPDX-License-Identifier = "OFL-1.1"


# The JavaScript chunks bundle our code with the Svelte, SvelteKit, devalue
# and clsx runtime code.
[[annotations]]
path = "fleetmgr/webui/build/**/*.js"
SPDX-FileCopyrightText = [
    "Deutsche Telekom AG",
    "2016-2025 Svelte Contributors <https://github.com/sveltejs/svelte/graphs/contributors>",
    "2020 SvelteKit Contributors <https://github.com/sveltejs/kit/graphs/contributors>",
    "2018-2019 devalue Contributors <https://github.com/rich-harris/devalue/graphs/contributors>",
    "Luke Edwards <luke.edwards05@gmail.com>"
]
SPDX-License-Identifier = "BSD-3-Clause AND MIT"

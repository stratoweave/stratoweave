name: ${TESTENV:=fleetmgr-lab}
# Prefix container names with the lab name instead of the default
# "clab-<lab-name>-", so names stay unique per testenv instance.
prefix: __lab-name

mgmt:
  network: ${TESTENV:=fleetmgr-lab}
  ipv4-subnet: auto
  ipv6-subnet: auto

topology:
  kinds:
    cisco_c8000v:
      # No public image; see C8000V_IMAGE in the Makefile.
      image: ${C8000V_IMAGE:=ghcr.io/stratoweave/vr-c8000v:17.18.02}
      # Match the credentials the fleet intent uses.
      env:
        USERNAME: admin
        PASSWORD: admin
  nodes:
    # FRR. configs/pe-01.conf is the boot config; the links it names are
    # attached after start, so exec makes the VRF and dot1Q devices and FRR
    # applies the held config as they appear.
    pe-01:
      kind: linux
      image: ${FRR_IMAGE:=quay.io/frrouting/frr:10.4.1}
      binds:
        - configs/pe-01.daemons:/etc/frr/daemons:ro
        - configs/pe-01.conf:/etc/frr/frr.conf:ro
        - configs/vtysh.conf:/etc/frr/vtysh.conf:ro
        - configs/pe-01-setup.sh:/usr/local/bin/pe-01-setup:ro
      exec:
        - pe-01-setup

    # Each CE carries its full day-0 config.
    ce1:
      kind: cisco_c8000v
      startup-config: configs/ce1.cfg
    ce2:
      kind: cisco_c8000v
      startup-config: configs/ce2.cfg
    ce3:
      kind: cisco_c8000v
      startup-config: configs/ce3.cfg

    # Serves image-server/images over SCP and HTTP; make pull fills it.
    image-server:
      kind: linux
      image: ${IMAGE_SERVER:=ghcr.io/stratoweave/lab-image-server:1}
      image-pull-policy: if-not-present
      binds:
        - image-server/images:/usr/share/nginx/html/images:ro

  links:
    # vr-c8000v: Gi1 is the qemu management NIC (NETCONF), Gi2 is the first
    # containerlab veth (eth1): the WAN to the PE, dot1Q 100 on both ends.
    - endpoints: ["ce1:eth1", "pe-01:eth2"]
    - endpoints: ["ce2:eth1", "pe-01:eth3"]
    - endpoints: ["ce3:eth1", "pe-01:eth4"]

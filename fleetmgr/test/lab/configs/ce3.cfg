! ce3 -- day-0 config, applied by containerlab at boot on top of the
! vrnetlab bootstrap.
!
! Only site in vrf-b; the PE's blackhole prefix is its one received route.
!
hostname ce3
!
! Reach the docker management network, where the image server is. Docker
! assigns it out of 172.16.0.0/12; 10.0.0.2 is the vrnetlab gateway on Gi1.
ip route 172.16.0.0 255.240.0.0 10.0.0.2
!
interface Loopback0
 ip address 10.255.2.1 255.255.255.255
!
! WAN to the PE.
interface GigabitEthernet2
 no ip address
 no shutdown
!
interface GigabitEthernet2.100
 encapsulation dot1Q 100
 ip address 10.0.2.2 255.255.255.252
 no shutdown
!
! Two discard routes: with Loopback0 exactly three advertised networks.
ip route 10.10.3.0 255.255.255.0 Null0
ip route 10.11.3.0 255.255.255.0 Null0
!
router bgp 65100
 bgp router-id 10.255.2.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.0.2.1 remote-as 65000
 !
 address-family ipv4 unicast
  neighbor 10.0.2.1 activate
  network 10.255.2.1 mask 255.255.255.255
  network 10.10.3.0 mask 255.255.255.0
  network 10.11.3.0 mask 255.255.255.0
 exit-address-family
!
end

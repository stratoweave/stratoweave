! pe-01: two Linux VRFs, each terminating eBGP from its CEs with as-override
! and originating one blackhole prefix, so every CE receives a route.
!
! Loaded at boot, before the links exist; pe-01-setup.sh makes the devices
! named here and FRR applies the held config as they appear.
!
frr defaults traditional
hostname pe-01
!
interface lo
 ip address 10.255.0.1/32
!
interface eth2.100
 description to ce1
 ip address 10.0.1.1/30
!
interface eth3.100
 description to ce2
 ip address 10.0.1.5/30
!
interface eth4.100
 description to ce3
 ip address 10.0.2.1/30
!
vrf vrf-a
 ip route 10.100.0.0/24 blackhole
exit-vrf
!
vrf vrf-b
 ip route 10.200.0.0/24 blackhole
exit-vrf
!
! Without "no bgp ebgp-requires-policy" FRR neither accepts nor announces
! anything on an eBGP session that has no route-map (RFC 8212).
router bgp 65000 vrf vrf-a
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.1.2 remote-as 65100
 neighbor 10.0.1.2 description to ce1
 neighbor 10.0.1.6 remote-as 65100
 neighbor 10.0.1.6 description to ce2
 !
 address-family ipv4 unicast
  redistribute static
  neighbor 10.0.1.2 as-override
  neighbor 10.0.1.6 as-override
 exit-address-family
exit
!
router bgp 65000 vrf vrf-b
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.2.2 remote-as 65100
 neighbor 10.0.2.2 description to ce3
 !
 address-family ipv4 unicast
  redistribute static
  neighbor 10.0.2.2 as-override
 exit-address-family
exit
!

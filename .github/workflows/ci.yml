name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  # ncurl ships as a standalone artifact under its own name even though it now
  # lives in the stratoweave monorepo (github.repository would be stratoweave).
  IMAGE: ghcr.io/stratoweave/ncurl

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actonlang/setup-acton@v1
        with:
          channel: 'tip'
      - name: "Check out repository code"
        uses: actions/checkout@v7
      - run: make check-dep-consistency
      - run: make
      - run: acton test
#      - run: acton test perf
      - run: make test-mini
      - run: git diff --exit-code

  fleetmgr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleetmgr
    steps:
      - uses: actonlang/setup-acton@v1
        with:
          channel: 'tip'
      - uses: extractions/setup-just@v4
      - name: "Check out repository code"
        uses: actions/checkout@v7
      - run: just gen
      - run: git diff --exit-code
      - run: just test
      - run: |
          acton build --release
          just system-test

  # The GC write-barrier checker makes a process exit with status 70 after a
  # collection that finds a pointer store without its write barrier.
  gc-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleetmgr
    steps:
      - uses: actonlang/setup-acton@v1
        with:
          channel: 'tip'
      - name: "Check out repository code"
        uses: actions/checkout@v7
      - run: acton test --gc-check
      # The tests open no SSH sessions. The demo does: at startup FleetMgr
      # pushes its 100 devices to the ten flotillas over NETCONF on SSH. The
      # demo must still run when timeout stops it (status 124), and no
      # flotilla may report a missing barrier.
      - name: "Demo under the write-barrier checker"
        run: |
          acton build
          mkdir -p out/images
          status=0
          ACTON_GC_CHECK=1 timeout 60 out/bin/fleetmgr --http.port 18200 --netconf.port 12900 \
            --software.image-dir out/images demo.xml demo-campaign.xml demo-images.xml 2> out/gc-check.err || status=$?
          cat out/gc-check.err
          test "$status" -eq 124
          ! grep -q GC_WBAR_VERIFY out/gc-check.err

  netconf:
    runs-on: ubuntu-latest
    steps:
      - uses: actonlang/setup-acton@v1
        with:
          channel: 'tip'
      - name: "Check out repository code"
        uses: actions/checkout@v7
      - name: "Start notconf in background"
        run: |
          docker run -td --name notconf --publish 42830:830 ghcr.io/notconf/notconf
      - name: "Wait for notconf"
        run: |
          for i in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' notconf)"
            echo "notconf health: ${status}"

            if [ "${status}" = "healthy" ]; then
              exit 0
            fi

            if [ "${status}" = "unhealthy" ]; then
              docker logs notconf
              exit 1
            fi

            sleep 1
          done

          docker logs notconf
          exit 1
      # notconf is stateful and module tests are sensitive to parallel/retry runs
      - run: acton test --tag notconf-server --module netconf --module netconf.test_notif --jobs 1 --min-iter 1 --max-iter 1

  etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actonlang/setup-acton@v1
        with:
          channel: 'tip'
      - name: "Check out repository code"
        uses: actions/checkout@v7
      - name: "Start etcd in background"
        run: |
          docker run -d --name etcd --publish 2379:2379 \
            gcr.io/etcd-development/etcd:v3.6.11 \
            /usr/local/bin/etcd \
            --name s1 \
            --data-dir /tmp/etcd-data \
            --listen-client-urls http://0.0.0.0:2379 \
            --advertise-client-urls http://0.0.0.0:2379 \
            --listen-peer-urls http://0.0.0.0:2380 \
            --initial-advertise-peer-urls http://0.0.0.0:2380 \
            --initial-cluster s1=http://0.0.0.0:2380 \
            --initial-cluster-state new \
            --max-txn-ops 100000 \
            --max-request-bytes 104857600 \
            --quota-backend-bytes 8589934592 \
            --auto-compaction-mode periodic \
            --auto-compaction-retention 10m
      - name: "Wait for etcd"
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:2379/health | grep -q '"health":"true"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs etcd
          exit 1
      # The race showed on the first request of a fresh process, so run the
      # module ten times, each a new process, with the cache off.
      - name: "Run etcd integration tests"
        run: |
          for i in $(seq 1 10); do
            echo "::group::etcd test run $i/10"
            acton test --tag etcd --module test_ttt_persistence_etcd --jobs 1 --min-iter 1 --max-iter 1 --no-cache
            echo "::endgroup::"
          done
      - name: "etcd logs on failure"
        if: failure()
        run: docker logs etcd
      - name: "Remove etcd"
        if: always()
        run: docker rm -f etcd

  ncurl:
    runs-on: ubuntu-latest
    steps:
      - uses: actonlang/setup-acton@v1
        with:
          channel: 'tip'
      - name: "Check out repository code"
        uses: actions/checkout@v7
      - name: "Cache acton stuff"
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/acton
            out
            !out/bin
          # Hacky cache update:
          # https://github.com/actions/cache/blob/main/tips-and-workarounds.md#update-a-cache
          key: ncurl-acton-${{ github.run_id }}
          restore-keys: |
            ncurl-acton
      - name: "Start notconf in background"
        run: |
          docker run -td --name notconf --publish 830:830 ghcr.io/notconf/notconf
      - run: make
      - name: "Wait for notconf"
        run: |
          for i in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' notconf)"
            echo "notconf health: ${status}"

            if [ "${status}" = "healthy" ]; then
              exit 0
            fi

            if [ "${status}" = "unhealthy" ]; then
              docker logs notconf
              exit 1
            fi

            sleep 1
          done

          docker logs notconf
          exit 1
      - name: "Test ncurl list-schemas"
        run: out/bin/ncurl --password admin list-schemas
      - name: "Test ncurl get-config"
        run: out/bin/ncurl --password admin get-config
      - name: "Test ncurl get-config with subtree filter"
        run: out/bin/ncurl --password admin get-config --filter-subtree '<netconf-server xmlns="urn:ietf:params:xml:ns:yang:ietf-netconf-server"/>'
      - name: "Test ncurl get-config and save to file"
        run: |
          out/bin/ncurl --password admin get-config --output test-config.xml
          test -f test-config.xml
      - name: "Test ncurl get-schema for all schemas"
        run: out/bin/ncurl --password admin get-schema
      - name: "Test ncurl get-schema for specific module"
        run: out/bin/ncurl --password admin get-schema --module ietf-netconf-monitoring
      - name: "Test ncurl get-schema for specific module-set"
        run: out/bin/ncurl --password admin get-schema --module-set ietf
      - name: "Test ncurl verbose mode"
        run: out/bin/ncurl --password admin --verbose list-schemas
      - name: "Test ncurl get-config with JSON format"
        run: out/bin/ncurl --password admin get-config --format json
      - name: "Test ncurl get-config with specific modules"
        run: out/bin/ncurl --password admin get-config --format acton-adata --module ietf-netconf-acm --module ietf-yang-types
      - name: "Test ncurl get-config with specific module-set"
        run: out/bin/ncurl --password admin get-config --format acton-adata --module-set ietf
      - name: "Test ncurl edit-config with file input"
        run: |
          out/bin/ncurl --password admin edit-config test/test-edit-config.xml --commit
          out/bin/ncurl --password admin get-config --filter-subtree '<interfaces xmlns="urn:ietf:params:xml:ns:yang:ietf-interfaces"/>' | grep -q "test-interface"
      - name: "Test ncurl notifications"
        run: |
          timeout 120 out/bin/ncurl --password admin notifications --notification ietf-netconf-notifications:netconf-config-change --count 1 > notif.out 2> notif.err &
          pid=$!
          for i in $(seq 1 120); do grep -q "^Listening" notif.err && break; sleep 0.5; done
          sed 's/test-interface/notif-interface/' test/test-edit-config.xml > notif-edit.xml
          out/bin/ncurl --password admin edit-config notif-edit.xml --commit
          wait $pid
          cat notif.err
          grep -q "netconf-config-change" notif.out
        # TODO: enable when we can detect EOF in stdin callback
#      - name: "Test ncurl edit-config with stdin input"
#        run: |
#          cat test/test-edit-config.xml | out/bin/ncurl --password admin edit-config -
      - uses: actions/upload-artifact@v7
        with:
          name: ncurl-linux-x86_64
          path: out/bin/ncurl
      - run: make build-linux-aarch64
      - uses: actions/upload-artifact@v7
        with:
          name: ncurl-linux-aarch64
          path: out/bin/ncurl
      - run: make build-macos-aarch64
      - uses: actions/upload-artifact@v7
        with:
          name: ncurl-macos-aarch64
          path: out/bin/ncurl

  ncurl-release:
    # Only run on the main branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Required for uploading release assets
      contents: write
    needs: ncurl
    env:
      TAG: tip
    steps:
      - name: "Check out repository code"
        uses: actions/checkout@v7
      - name: Delete tag
        run: gh release delete ${{ env.TAG }} --cleanup-tag --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Download all binary artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: ncurl-*
      - name: "Prepare binary release assets"
        run: |
          mkdir -p release-assets
          cp ncurl-linux-x86_64/ncurl release-assets/ncurl-linux-x86_64
          cp ncurl-linux-aarch64/ncurl release-assets/ncurl-linux-aarch64
          cp ncurl-macos-aarch64/ncurl release-assets/ncurl-macos-aarch64
      - name: "Upload artifacts as release packages"
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "release-assets/ncurl-*"
          draft: false
          prerelease: true
          name: ${{ env.TAG }}
          tag: ${{ env.TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          replacesArtifacts: true

  ncurl-images:
    if: github.ref == 'refs/heads/main'
    needs: ncurl
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Check out repository code"
        uses: actions/checkout@v7
      - name: "Download binary artifact"
        uses: actions/download-artifact@v8
        with:
          name: ncurl-linux-${{ matrix.arch }}
          path: out/bin
      - name: "Make binary executable"
        run: chmod +x out/bin/ncurl
      - name: "Log in to GHCR"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Build and push arch-specific container image"
        run: |
          docker build --pull --provenance=false -f Dockerfile.ncurl -t ${{ env.IMAGE }}:latest-${{ matrix.arch }} .
          docker push ${{ env.IMAGE }}:latest-${{ matrix.arch }}

  ncurl-manifest:
    if: github.ref == 'refs/heads/main'
    needs: ncurl-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Log in to GHCR"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Create and push multi-arch manifests"
        run: |
          docker manifest create ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:latest-x86_64 \
            ${{ env.IMAGE }}:latest-aarch64
          docker manifest push ${{ env.IMAGE }}:latest
      - name: "Inspect published manifest"
        run: docker manifest inspect ${{ env.IMAGE }}:latest
